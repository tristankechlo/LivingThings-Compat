name: Build and Release

on:
  release:
    types: [published]

env:
  CURSEFORGE_ID: 1674826
  MODRINTH_ID: "M6rSUTth"

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      pack-version: ${{ steps.props.outputs.version }}
      mc-version: ${{ steps.props.outputs.mc_version }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: calculate versions
        id: props
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: 'pack.properties'
          properties: 'name version mc_version version_range'

      - name: create zip archive
        run: git archive -o $FILENAME --add-file "./LICENSE" HEAD:src
        env:
            FILENAME: "${{ steps.props.outputs.name }}-${{ steps.props.outputs.mc_version }}-${{ steps.props.outputs.version }}.zip"

      - name: Add files to GitHub-Release
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: "./${{ steps.props.outputs.name }}-*.zip"
          overwrite: true

      - name: publish to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        if: ${{ contains(github.event.release.name, '[RELEASE]') }}
        with:
            # modrinth-id: ${{ env.MODRINTH_ID }}
            # modrinth-featured: true
            # modrinth-unfeature-mode: intersection
            # modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
            # modrinth-name: "${{ steps.props.outputs.mc_version }} - ${{ steps.props.outputs.version }}"
            # modrinth-version: "${{ steps.props.outputs.mc_version }}-${{ steps.props.outputs.version }}"
            # curseforge has the dependencies on the project level, added automatically to all uploads, so we don't need to add them here
            # adding LivingThings as a required dependency and Xaero's Minimap as an optional dependency for modrinth
            modrinth-dependencies: |
              UKDLi1GJ(required)
              1bokaNcj(optional)
            curseforge-id: ${{ env.CURSEFORGE_ID }}
            curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
            curseforge-name: ""
            curseforge-version: ""
            version-type: "release"
            loaders: minecraft
            files: "./${{ steps.props.outputs.name }}-*.zip"
            changelog:  "${{ github.event.release.body }}"
            game-versions: "${{ steps.props.outputs.version_range }}"
            game-version-filter: "releases"

  send-discord-embed:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Make embed
        uses: tristankechlo/create-discord-embed@v1.1
        with:
          released: ${{ contains(github.event.release.name, '[RELEASE]') }}
          changelog: "${{ github.event.release.body }}"
          version: "${{ needs.build.outputs.mc-version }} - ${{ needs.build.outputs.pack-version }}"
          color: 2326507
          mod-name: "LivingThings-Compat"
          loaders: Forge,Fabric,NeoForge
          curseforge: "https://www.curseforge.com/minecraft/mc-mods/living-things-compat"
          modrinth: "https://modrinth.com/mod/living-things-compat"
          github: ${{ github.event.release.html_url }}
          thumbnail: "https://cdn.modrinth.com/data/UKDLi1GJ/d345468b19bfd5ffffa1ed070297a6a74535e9d6.png"

      - name: Send Discord Message
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          raw-data: ./embed.json
